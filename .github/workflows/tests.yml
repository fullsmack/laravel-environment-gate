name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: composer lint

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', testbench: '^8.39' }
          - { php: '8.3', laravel: '10', testbench: '^8.39' }
          - { php: '8.2', laravel: '11', testbench: '^9.0' }
          - { php: '8.4', laravel: '11', testbench: '^9.0' }
          - { php: '8.2', laravel: '12', testbench: '^10.0' }
          - { php: '8.4', laravel: '12', testbench: '^10.0' }
          - { php: '8.3', laravel: '13', testbench: '^11.0' }
          - { php: '8.4', laravel: '13', testbench: '^11.0' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Laravel 10 is end-of-life and every release carries security advisories,
      # which Composer blocks by default. This only affects the test install.
      - run: composer update --no-interaction --no-progress --with-all-dependencies --no-security-blocking --with "orchestra/testbench:${{ matrix.testbench }}"
      - run: vendor/bin/phpunit
